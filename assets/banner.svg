<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-label="Alain Paunero, desarrollador de aplicaciones multiplataforma: Kotlin, Java, Android, C#, Unity, SQL y Linux">
  <title>Alain Paunero — banner del perfil</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a11"/>
      <stop offset="55%" stop-color="#0a1524"/>
      <stop offset="100%" stop-color="#0d1b2b"/>
    </linearGradient>

    <linearGradient id="nombre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bcd4ea"/>
    </linearGradient>

    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="barrido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="haloAzul" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloVioleta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="rejilla" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7dd3fc" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="recortePanel">
      <rect x="700" y="64" width="436" height="172" rx="14"/>
    </clipPath>

    <!-- El texto se descubre de izquierda a derecha; sin animación queda visible entero. -->
    <clipPath id="recorteTexto">
      <rect x="716" y="203" width="320" height="28">
        <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.26;0.94;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <style>
      /* El movimiento es decorativo: si el sistema pide menos animación, se queda quieto. */
      @keyframes latido   { 0%,100% { opacity: 0.16 } 50% { opacity: 0.42 } }
      @keyframes latidoBorde { 0%,100% { stroke-opacity: 0.22 } 50% { stroke-opacity: 0.48 } }
      @keyframes flujo    { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -240 } }
      @keyframes temblor  { 0%,100% { opacity: 0.14 } 45% { opacity: 0.34 } 70% { opacity: 0.22 } }

      .glifo  { animation: temblor 4.2s ease-in-out infinite }
      .rejita { animation: latido 9s ease-in-out infinite }
      .flujo  { animation: flujo 9s linear infinite }
      .borde  { animation: latidoBorde 6s ease-in-out infinite }

      @media (prefers-reduced-motion: reduce) {
        .glifo, .rejita, .flujo, .borde { animation: none }
      }
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="300" fill="url(#fondo)"/>
  <rect width="1200" height="300" fill="url(#rejilla)" class="rejita"/>
  <ellipse cx="1080" cy="20" rx="330" ry="210" fill="url(#haloAzul)"/>
  <ellipse cx="120" cy="300" rx="300" ry="180" fill="url(#haloVioleta)"/>

  <!-- barrido de luz -->
  <g opacity="0.9">
    <rect x="-260" y="-40" width="200" height="380" fill="url(#barrido)" transform="skewX(-14)">
      <animate attributeName="x" values="-260;1300" dur="7.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bloque izquierdo: identidad -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="76" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14.5"
          fill="#5eead4" fill-opacity="0.85" letter-spacing="0.6">alain8123@ethazi:~$ whoami</text>

    <rect x="292" y="63" width="8" height="15" fill="#5eead4">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <text x="62" y="140" font-size="56" font-weight="700" fill="url(#nombre)" letter-spacing="-0.8">Alain Paunero</text>

    <rect x="64" y="154" width="0" height="3.5" rx="1.75" fill="url(#acento)">
      <animate attributeName="width" from="0" to="104" dur="1s" begin="0.2s" fill="freeze"/>
    </rect>

    <text x="64" y="200" font-size="16.5" fill="#9fb3c8">
      Apps Android en Kotlin, escritorio en Java, juegos en Unity.
    </text>

    <!-- etiquetas del stack -->
    <g font-size="12.5" fill="#cbd5e1" letter-spacing="0.2">
      <g>
        <rect x="64" y="224" width="70" height="26" rx="13" fill="#38bdf8" fill-opacity="0.07" stroke="#38bdf8" stroke-opacity="0.35"/>
        <text x="99" y="241" text-anchor="middle">Kotlin</text>
      </g>
      <g>
        <rect x="142" y="224" width="56" height="26" rx="13" fill="#f97316" fill-opacity="0.07" stroke="#f97316" stroke-opacity="0.35"/>
        <text x="170" y="241" text-anchor="middle">Java</text>
      </g>
      <g>
        <rect x="206" y="224" width="76" height="26" rx="13" fill="#3ddc84" fill-opacity="0.07" stroke="#3ddc84" stroke-opacity="0.35"/>
        <text x="244" y="241" text-anchor="middle">Android</text>
      </g>
      <g>
        <rect x="290" y="224" width="46" height="26" rx="13" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.35"/>
        <text x="313" y="241" text-anchor="middle">C#</text>
      </g>
      <g>
        <rect x="344" y="224" width="62" height="26" rx="13" fill="#e2e8f0" fill-opacity="0.06" stroke="#e2e8f0" stroke-opacity="0.3"/>
        <text x="375" y="241" text-anchor="middle">Unity</text>
      </g>
      <g>
        <rect x="414" y="224" width="48" height="26" rx="13" fill="#facc15" fill-opacity="0.07" stroke="#facc15" stroke-opacity="0.3"/>
        <text x="438" y="241" text-anchor="middle">SQL</text>
      </g>
      <g>
        <rect x="470" y="224" width="58" height="26" rx="13" fill="#f87171" fill-opacity="0.07" stroke="#f87171" stroke-opacity="0.3"/>
        <text x="499" y="241" text-anchor="middle">Linux</text>
      </g>
      <g>
        <rect x="536" y="224" width="46" height="26" rx="13" fill="#94a3b8" fill-opacity="0.07" stroke="#94a3b8" stroke-opacity="0.3"/>
        <text x="559" y="241" text-anchor="middle">Git</text>
      </g>
    </g>
  </g>

  <!-- línea de señal (telemetría) -->
  <g>
    <polyline points="64,282 132,282 148,270 164,282 232,282 248,262 266,288 284,282 372,282"
              fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="8 10" class="flujo"/>
    <text x="1136" y="286" text-anchor="end" font-family="Consolas,'Cascadia Mono',Menlo,monospace"
          font-size="11" fill="#64748b">abierto a prácticas · DAM</text>
  </g>

  <!-- panel derecho: descifrado -->
  <g clip-path="url(#recortePanel)" font-family="Consolas,'Cascadia Mono',Menlo,monospace">
    <rect x="700" y="64" width="436" height="172" fill="#020814" fill-opacity="0.62"/>
    <rect x="700" y="64" width="436" height="172" fill="none" stroke="#38bdf8" stroke-width="1.2"
          stroke-opacity="0.3" class="borde" rx="14"/>

    <circle cx="722" cy="86" r="4" fill="#f87171" fill-opacity="0.75"/>
    <circle cx="736" cy="86" r="4" fill="#fbbf24" fill-opacity="0.75"/>
    <circle cx="750" cy="86" r="4" fill="#34d399" fill-opacity="0.75"/>
    <text x="768" y="90" font-size="11" fill="#64748b">decrypt.sh — RunnersZ · CipherSprint</text>
    <line x1="716" y1="102" x2="1120" y2="102" stroke="#38bdf8" stroke-opacity="0.15"/>

    <g font-size="18" fill="#7dd3fc">
      <text x="722" y="132" class="glifo">Δ</text>
      <text x="766" y="132" class="glifo" style="animation-delay:-1.1s">7</text>
      <text x="810" y="132" class="glifo" style="animation-delay:-2.4s">Ψ</text>
      <text x="854" y="132" class="glifo" style="animation-delay:-0.6s">#</text>
      <text x="898" y="132" class="glifo" style="animation-delay:-3.1s">Ω</text>
      <text x="942" y="132" class="glifo" style="animation-delay:-1.8s">4</text>
      <text x="986" y="132" class="glifo" style="animation-delay:-2.9s">λ</text>
      <text x="1030" y="132" class="glifo" style="animation-delay:-0.9s">Ξ</text>
      <text x="1074" y="132" class="glifo" style="animation-delay:-2.1s">Σ</text>

      <text x="722" y="158" class="glifo" style="animation-delay:-2.6s">9</text>
      <text x="766" y="158" class="glifo" style="animation-delay:-0.4s">Φ</text>
      <text x="810" y="158" class="glifo" style="animation-delay:-1.5s">%</text>
      <text x="854" y="158" class="glifo" style="animation-delay:-3.4s">Δ</text>
      <text x="898" y="158" class="glifo" style="animation-delay:-2.2s">2</text>
      <text x="942" y="158" class="glifo" style="animation-delay:-1.2s">Ψ</text>
      <text x="986" y="158" class="glifo" style="animation-delay:-0.7s">Ω</text>
      <text x="1030" y="158" class="glifo" style="animation-delay:-3.0s">1</text>
      <text x="1074" y="158" class="glifo" style="animation-delay:-1.9s">#</text>

      <text x="722" y="184" class="glifo" style="animation-delay:-1.7s">Ξ</text>
      <text x="766" y="184" class="glifo" style="animation-delay:-3.3s">3</text>
      <text x="810" y="184" class="glifo" style="animation-delay:-0.5s">Σ</text>
      <text x="854" y="184" class="glifo" style="animation-delay:-2.8s">λ</text>
      <text x="898" y="184" class="glifo" style="animation-delay:-1.3s">8</text>
      <text x="942" y="184" class="glifo" style="animation-delay:-2.5s">Φ</text>
      <text x="986" y="184" class="glifo" style="animation-delay:-0.8s">Δ</text>
      <text x="1030" y="184" class="glifo" style="animation-delay:-3.2s">5</text>
      <text x="1074" y="184" class="glifo" style="animation-delay:-2.0s">Ψ</text>
    </g>

    <g clip-path="url(#recorteTexto)">
      <text x="722" y="222" font-size="15" fill="#67e8f9">› KOTLIN · JAVA · C# · UNITY · SQL</text>
    </g>
  </g>
</svg>
