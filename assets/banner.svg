  <rect x="70" y="204" width="130" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="254" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="23" fill="#cbd5e1">Desarrollador de Aplicaciones Multiplataforma</text>
